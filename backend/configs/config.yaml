server:
  port: 8080
  mode: debug

database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: root
  database: edurec
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  access_secret: "change-me-in-production"
  refresh_secret: "change-me-in-production-too"
  access_expire: 15
  refresh_expire: 10080

engine:
  # 推荐结果文件：engine 侧生成后【手动拷贝】到这里（见 docs/data-handoff.md）
  recommendations_file: "data/recommendations.json"
  # 演示/模拟数据集：engine 侧 dataset/sim【手动拷贝】到这里（demo_seed 播种用）
  dataset_dir: "data/sim"
  # 数据快照导出目录（export_snapshot 输出，平台本地；再手动拷给 engine 训练）
  snapshot_dir: "data/snapshots"

bilibili:
  # 在线搜索/评论实时爬取（后端 os/exec 调 backend/crawler/online.py）
  python_path: "python"
  crawler_dir: "crawler"
  category: "B站视频"
  search_limit: 10
  # 无限滚动时最多翻多少页 B 站结果，防无界爬取
  search_max_pages: 5
  comment_limit: 20

# 第三方数据集导入（cmd/import_dataset）。各家数据集的字段名和格式都不一样，
# 所以对应关系全部写在下面，换数据集只改这一段，不动代码。
# 三步走：
#   go run ./cmd/import_dataset --dataset mooc --preview   # 先核对映射对不对
#   go run ./cmd/import_dataset --dataset mooc --dry-run   # 再看到底会新增/刷新多少条
#   go run ./cmd/import_dataset --dataset mooc             # 确认无误后真导入
datasets:
  mooc:
    # 数据集文件路径，相对 backend/ 运行目录。字段名先按慕课网搜索接口的形态预填，
    # 拿到真实数据集后按实际列名改。
    file: "data/mooc/courses.json"
    # auto | json | jsonl | csv。auto 按扩展名判定，扩展名不认识时看首个非空字符
    format: "auto"
    # 记录数组在 JSON 里的位置，点号分隔；留空表示根节点就是数组
    items_path: "data.list"
    # 落库的 resources.type：course | article | video
    resource_type: "course"
    # 记录里取不到分类时用的兜底分类名
    default_category: "慕课课程"
    # 记录里取不到来源链接时用这个模板拼，{字段名} 是占位符。
    # 二者都取不到的行会被跳过——source_url 是判重的唯一依据，拼不出来就会重复导入
    source_url_template: ""
    # tags 是字符串时的分隔符
    tag_separator: ","
    # 内部字段 → 外部字段候选。左边只能填固定词表里的名字，写错会直接报错：
    #   title / description / cover_url / author / source_url / category / tags / view_count
    # 右边是候选列表，按序取第一个非空值，支持点号路径（如 author.nickname）
    fields:
      title: ["title", "name"]
      description: ["short_description", "description"]
      cover_url: ["pic"]
      author: ["author_nickname"]
      source_url: ["target_url"]
      category: ["category"]
      tags: ["tags"]
      view_count: ["numbers"]
    # 原样收进 resources.metadata 的外部字段，换推荐模型时可能用得上
    metadata: ["obj_id", "price"]